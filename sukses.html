<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instruksi Pembayaran & Akses Drive - EduBooks Kids</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: { brand: { 500: '#3b82f6', 600: '#2563eb' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-8 text-center shadow-2xl">
        
        <div class="w-16 h-16 bg-emerald-500/10 text-emerald-400 rounded-full flex items-center justify-center text-3xl mx-auto mb-6">
            <i class="fa-solid fa-folder-plus"></i>
        </div>

        <h1 class="text-2xl font-bold text-white mb-2">Pesanan Hampir Selesai!</h1>
        <p class="text-slate-400 text-sm mb-6">Terima kasih <span id="outNama" class="text-white font-semibold">Orang Tua</span>, pesanan <span id="outPlan" class="text-brand-500 font-semibold">Paket Belajar</span> Anda siap diaktifkan.</p>

        <!-- Box Transfer Pembayaran -->
        <div class="bg-slate-950 border border-slate-800 rounded-2xl p-6 text-left space-y-3 mb-6">
            <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Rekening Transfer Pembayaran</p>
            
            <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                <span class="text-xs text-slate-400">Bank BCA</span>
                <span class="font-mono text-sm font-bold text-white">123-456-7890</span>
            </div>

            <div class="flex justify-between items-center border-b border-slate-800/80 pb-2">
                <span class="text-xs text-slate-400">Nominal Transfer</span>
                <span id="outHarga" class="text-base font-extrabold text-emerald-400">Rp 0</span>
            </div>

            <div class="pt-2 border-t border-slate-800/80">
                <span class="text-xs text-slate-500 block">Gmail Akses Terdaftar:</span>
                <p id="outEmail" class="text-xs text-brand-400 font-mono font-semibold mt-0.5"></p>
            </div>
        </div>

        <!-- Tombol Konfirmasi WhatsApp -->
        <a id="btnWA" href="#" target="_blank" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition-all flex items-center justify-center gap-2 mb-4">
            <i class="fa-brands fa-whatsapp text-lg"></i> Konfirmasi Pembayaran via WhatsApp
        </a>

        <a href="index.html" class="text-xs text-slate-500 hover:text-slate-400">Kembali ke Halaman Utama</a>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const nama = urlParams.get('nama') || 'Orang Tua';
        const email = urlParams.get('email') || '-';
        const plan = urlParams.get('plan') || 'Paket Belajar';
        const harga = urlParams.get('harga') || 'Rp 0';

        document.getElementById('outNama').innerText = nama;
        document.getElementById('outEmail').innerText = email;
        document.getElementById('outPlan').innerText = plan;
        document.getElementById('outHarga').innerText = harga;

        // Ganti dengan nomor WhatsApp Anda
        const noWA = "6282151809816"; // Format: 62 + nomor tanpa 0 di depan
        const pesanWA = `Halo Admin EduBooks Kids, saya sudah melakukan pemesanan modul belajar anak.\n\nNama: ${nama}\nGmail Akses: ${email}\nPaket: ${plan}\nTotal: ${harga}\n\nMohon konfirmasi pembayaran dan masukkan email Gmail saya ke izin akses Google Drive. Terima kasih!`;
        
        document.getElementById('btnWA').href = `https://wa.me/${noWA}?text=${encodeURIComponent(pesanWA)}`;
    </script>
</body>
</html>
